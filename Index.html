<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHREE SHYAM CSC CENTRE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-orange-600 text-white p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold">SHREE SHYAM CSC CENTRE</h1>
        <p class="mt-2 text-lg">Helpline No: <strong>9416478687</strong></p>
        <p class="text-sm">Near Dhramasala, Near Dispensary, Nihalawas, Mahendargarh, Haryana, 123028</p>
    </header>

    <!-- Info Banner -->
    <div class="max-w-4xl mx-auto mt-6 bg-white p-4 shadow rounded flex justify-between items-center">
        <div>
            <span class="font-bold text-gray-700">Current Time: </span>
            <span id="real-time-clock" class="text-blue-600 font-mono"></span>
        </div>
        <div>
            <span class="font-bold text-gray-700">Shop Status: </span>
            <span id="shop-status" class="px-3 py-1 rounded text-white bg-green-500 font-bold">OPEN</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto mt-6 grid grid-cols-1 md:grid-cols-2 gap-6 pb-10">
        
        <!-- Services List -->
        <div class="bg-white p-6 shadow rounded">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-2 mb-4">Available Services</h2>
            <div id="services-list" class="space-y-4">
                <!-- Services will be loaded here dynamically -->
                <p class="text-gray-500">Loading services...</p>
            </div>
        </div>

        <!-- Booking Form -->
        <div class="bg-white p-6 shadow rounded">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-2 mb-4">Book a Service</h2>
            <form id="booking-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-1">Your Full Name *</label>
                    <input type="text" id="cust-name" required class="w-full border p-2 rounded focus:ring-orange-500 focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">Your Phone No. *</label>
                    <input type="tel" id="cust-phone" required class="w-full border p-2 rounded focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">Select Service *</label>
                    <select id="cust-service" required class="w-full border p-2 rounded focus:ring-orange-500">
                        <!-- Options loaded via JS -->
                    </select>
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded transition">
                    Submit Booking
                </button>
            </form>
            <div id="success-msg" class="hidden mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                Booking Successful! The owner has received your request.
            </div>
        </div>
    </div>

    <script>
        // Real-Time Clock
        setInterval(() => {
            document.getElementById('real-time-clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Load Services and Shop Status from LocalStorage
        function loadPublicData() {
            let services = JSON.parse(localStorage.getItem('csc_services')) || [];
            let status = localStorage.getItem('csc_status') || 'OPEN';
            
            // Set Shop Status
            let statusBadge = document.getElementById('shop-status');
            statusBadge.innerText = status;
            statusBadge.className = status === 'OPEN' 
                ? 'px-3 py-1 rounded text-white bg-green-500 font-bold' 
                : 'px-3 py-1 rounded text-white bg-red-500 font-bold';

            // Load Services
            let listHTML = '';
            let selectHTML = '<option value="">-- Choose a Service --</option>';
            
            if(services.length === 0) {
                listHTML = '<p class="text-gray-500">No services added by owner yet.</p>';
            } else {
                services.forEach(srv => {
                    listHTML += `
                        <div class="border p-3 rounded bg-gray-50">
                            <h3 class="font-bold text-lg text-orange-600">${srv.name}</h3>
                            <p class="text-sm text-gray-700"><strong>Charge:</strong> ₹${srv.charge}</p>
                            <p class="text-sm text-gray-700"><strong>Timeline:</strong> ${srv.timeline}</p>
                        </div>`;
                    selectHTML += `<option value="${srv.name}">${srv.name} - ₹${srv.charge}</option>`;
                });
            }
            
            document.getElementById('services-list').innerHTML = listHTML;
            document.getElementById('cust-service').innerHTML = selectHTML;
        }

        // Handle Bookings
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let newBooking = {
                id: Date.now(),
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                service: document.getElementById('cust-service').value,
                date: new Date().toLocaleString()
            };

            let bookings = JSON.parse(localStorage.getItem('csc_bookings')) || [];
            bookings.push(newBooking);
            localStorage.setItem('csc_bookings', JSON.stringify(bookings));

            document.getElementById('booking-form').reset();
            document.getElementById('success-msg').classList.remove('hidden');
            setTimeout(() => document.getElementById('success-msg').classList.add('hidden'), 4000);
        });

        // Initialize
        loadPublicData();
        // Check for updates every 5 seconds (in case admin updates something)
        setInterval(loadPublicData, 5000);
    </script>
</body>
</html>
